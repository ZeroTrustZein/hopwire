# Tuned against `aegis-bench synth` (see bench/README.md). Config-only changes; see report notes.

[fan_in]
# Old high-in-degree accounts (merchants) max out at 0.85 * 0.58 = 0.49 < review on their own;
# young accounts (+0.15) with >= 10 senders reach review.
weight = 0.58
min_senders = 6

[fan_out]
weight = 0.6

[velocity]
weight = 0.7
max_count = 15
# Sum limit was tripping on payroll runs; count is the useful signal here.
max_sum_minor = 50_000_000

[shared_id]
weight = 0.85
min_accounts = 4
# n=4 -> 0.43 (no alert alone), n>=5 -> >= 0.52. min_accounts=3 flagged household devices.
