[package]
name = "hopwire-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["onnx"]
kafka = ["dep:rskafka"]
onnx = ["hopwire-core/onnx"]

[dependencies]
hopwire-core = { path = "../hopwire-core" }
hopwire-ee = { path = "../hopwire-ee" }
hopwire-iso20022 = { path = "../hopwire-iso20022" }
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["macros"] }
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = { version = "0.3.34", default-features = false }
hex = "0.4.3"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
rskafka = { version = "0.6.0", optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "migrate", "uuid", "chrono", "json"] }
tokio = { version = "1.53.2", features = ["full"] }
tower-http = { version = "0.7.1", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1.5"
postgresql_embedded = { version = "0.21.0", features = ["tokio"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.27.0", features = ["v4"] }
