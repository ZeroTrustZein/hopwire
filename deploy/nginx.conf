# Rendered by the nginx image entrypoint to /etc/nginx/conf.d/default.conf.
# ${AEGIS_ENGINE_URL} is substituted at container start (default http://engine:8080).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Batch replays (POST /v1/transactions, up to 10 000 txns) can be several MB.
    client_max_body_size 32m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    # Security headers. Locations below must not use add_header (it would drop these).
    # connect-src 'self' assumes the console calls the API same-origin (VITE_API_URL empty).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location /v1/ {
        proxy_pass ${AEGIS_ENGINE_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /healthz {
        proxy_pass ${AEGIS_ENGINE_URL};
    }

    location = /metrics {
        proxy_pass ${AEGIS_ENGINE_URL};
    }

    # Hashed build assets: cache hard.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
