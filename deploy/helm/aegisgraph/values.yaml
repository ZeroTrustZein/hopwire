# AegisGraph Helm values. Postgres is external (bring your own, e.g. RDS/Cloud SQL).

engine:
  image:
    repository: aegisgraph/engine
    tag: ""            # defaults to .Chart.AppVersion
    pullPolicy: IfNotPresent
  # The engine is a single-writer in-memory graph: exactly one replica, Recreate rollouts.
  logLevel: info
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 4Gi }

console:
  enabled: true
  replicas: 1
  image:
    repository: aegisgraph/console
    tag: ""
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }

# Secret holding the engine credentials. Keys: `api-key`, `database-url`.
# Recommended: create it out of band and set existingSecret.
#   kubectl create secret generic aegis-secrets \
#     --from-literal=api-key=... --from-literal=database-url=postgres://...
existingSecret: ""
# Only used when existingSecret is empty (dev/test convenience; values land in Helm release state).
secret:
  apiKey: ""
  databaseUrl: ""

# Contents of config.toml (mounted at /etc/aegis/config.toml).
# Empty = the config.example.toml baked into the engine image. Paste a tuned copy here.
config: ""

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: aegis.example.internal
  tls: []
  #  - secretName: aegis-tls
  #    hosts: [aegis.example.internal]

imagePullSecrets: []
nodeSelector: {}
tolerations: []
