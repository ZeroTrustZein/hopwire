{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hopwire.secretName" . }}
  labels:
    {{- include "hopwire.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ required "set existingSecret, or secret.apiKey" .Values.secret.apiKey | quote }}
  database-url: {{ required "set existingSecret, or secret.databaseUrl" .Values.secret.databaseUrl | quote }}
{{- end }}
