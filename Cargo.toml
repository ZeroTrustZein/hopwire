[workspace]
resolver = "2"
members = ["crates/aegis-core", "crates/aegis-server", "crates/aegis-bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
